[build]
  # Directory to change to before starting build
  base = "mobile"
  # Build command
  command = "npm run build:web"
  # Directory with the production build (relative to base)
  publish = "dist"

[build.environment]
  # Set the API URL for production
  EXPO_PUBLIC_API_URL = "https://appadmin.houseofbeers.nl/api"
  # Fallback for web push. The app normally fetches the VAPID public key from
  # /api/notifications/vapid-public-key/; this is used only if that request
  # fails. Public by design — the private half lives in the backend's
  # VAPID_PRIVATE_KEY config var and must never appear here.
  # Regenerating the pair invalidates every existing push subscription.
  EXPO_PUBLIC_VAPID_PUBLIC_KEY = "BNd_6FxL1Zkhlcv7YRT7qt719bhqLWMiaq3I7oQ_HPPsk0miVZcVF2HGF_r8S6tgFlkr-JoPlByc_jr-6PIUEW0"

# SPA fallback - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker should not be cached long
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Manifest should be fresh
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
